# Deploy browser games to GitHub Pages
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site if missing (fixes "Get Pages site failed")
          enablement: true

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R web _site/web
          mkdir -p _site/fps-aaa
          cp -R fps-aaa/index.html fps-aaa/src fps-aaa/vendor fps-aaa/README.md _site/fps-aaa/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
